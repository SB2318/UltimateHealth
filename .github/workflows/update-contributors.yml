# ──────────────────────────────────────────────────────────────────────────────
# 📝 Update Contributors in README
# ──────────────────────────────────────────────────────────────────────────────
#
# DESCRIPTION:
#   Automatically adds a merged PR author to the contributors section of the
#   README.md file after their PR is merged into main or web. This ensures
#   every contributor is publicly acknowledged across both branches.
#
# HOW IT WORKS:
#   1. Triggers when a PR is closed (merged) on main or web branches.
#   2. Skips if the PR was closed without merging, or if the author is a Bot.
#   3. Checks out the full repository history.
#   4. Always updates the central contributors table on `main` branch.
#   5. If the PR was targeting `web`, also synchronizes the contributor into `web`.
#   6. Uses concurrency group to prevent simultaneous runs from corrupting README.
#
# TRIGGERS:
#   - Automatic : Fires when a PR is merged into main or web.
#   - Skipped   : PRs closed without merging, or opened by Bot accounts.
#
# CONCURRENCY:
#   - Group: update-contributors (cancel-in-progress: false)
#     Runs are queued — never cancelled — to avoid missing contributors.
#
# PERMISSIONS REQUIRED:
#   - contents: write  → to commit and push the updated README.md
#
# SECRETS REQUIRED:
#   - GITHUB_TOKEN  → provided automatically by GitHub, no setup needed
# ──────────────────────────────────────────────────────────────────────────────

name: Update Contributors

concurrency:
  group: update-contributors
  cancel-in-progress: false

on:
  pull_request_target:
    types: 
      - closed
    branches:
      - main
      - web

jobs:
  update-readme:
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Update Contributors in main branch
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git checkout main
          python .github/scripts/update_contributors.py "$PR_AUTHOR"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "User $PR_AUTHOR is already present in main README.md."
          else
            git commit -m "docs: add @$PR_AUTHOR to contributors list"
            git push origin main
            echo "Successfully committed and pushed contributor to main."
          fi

      - name: Update Contributors in web branch (if PR targeted web)
        if: github.event.pull_request.base.ref == 'web'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout web
          python .github/scripts/update_contributors.py "$PR_AUTHOR"
          git add README.md
          
          if git diff --staged --quiet; then
            echo "User $PR_AUTHOR is already present in web README.md."
          else
            git commit -m "docs: add @$PR_AUTHOR to contributors list"
            git push origin web
            echo "Successfully committed and pushed contributor to web."
          fi
